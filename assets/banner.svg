<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .dynamic-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .dynamic-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 1000px 320px;
      }
      .dynamic-stream {
        stroke-dasharray: 8, 12;
        animation: waveDash 10s linear infinite;
      }
      .dynamic-chip-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .dynamic-chip-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .dynamic-chip-3 {
        animation: floatSlow 8s ease-in-out infinite reverse;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="dynamic-orb-1" cx="220" cy="90" r="160" fill="url(#glowGrad1)" />
  <circle class="dynamic-orb-2" cx="980" cy="310" r="180" fill="url(#glowGrad2)" />

  <!-- Animated Data Streams / Visual Flow lines in Background -->
  <path class="dynamic-stream" d="M-50,330 Q 300,380 600,300 T 1250,340" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.4" />
  <path class="dynamic-stream" d="M-50,90 Q 400,20 750,110 T 1250,70" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.35" />

  <!-- Floating Dynamic Decorative Tech Chips (Background Depth) -->
  <g class="dynamic-chip-1">
    <rect x="90" y="45" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glowFilter)" />
    <circle cx="108" cy="62" r="5" fill="#38bdf8" />
    <text x="122" y="66" class="pill-text" fill="#bae6fd">🛒 Headless</text>
  </g>

  <g class="dynamic-chip-2">
    <rect x="970" y="60" width="145" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glowFilter)" />
    <circle cx="988" cy="77" r="5" fill="#c084fc" />
    <text x="1002" y="81" class="pill-text" fill="#f3e8ff">⚡ Open Source</text>
  </g>

  <g class="dynamic-chip-3">
    <rect x="1010" y="335" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glowFilter)" />
    <circle cx="1028" cy="352" r="5" fill="#34d399" />
    <text x="1042" y="356" class="pill-text" fill="#d1fae5">💳 0% GMV Fee</text>
  </g>

  <g class="dynamic-chip-1">
    <rect x="65" y="335" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glowFilter)" />
    <circle cx="83" cy="352" r="5" fill="#fbbf24" />
    <text x="97" y="356" class="pill-text" fill="#fef3c7">🚀 Self-Hosted</text>
  </g>

  <!-- Foreground Content Container (Ensures Text and Title are firmly in foreground) -->
  <g transform="translate(600, 155)">
    <!-- Category Pill Badge -->
    <rect x="-185" y="-60" width="370" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <text x="0" y="-37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#60a5fa">✦ CURATED AWESOME LIST ✦</text>

    <!-- Main Title -->
    <text x="0" y="15" text-anchor="middle" class="title-text">
      Awesome Digital Storefront &amp; E-Commerce
    </text>

    <!-- Gradient Divider Bar -->
    <rect x="-160" y="38" width="320" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="75" text-anchor="middle" class="tagline-text">
      The Complete Guide to SaaS Platforms, Headless Commerce &amp; Self-Hosted Open-Source Stores
    </text>

    <!-- Interactive Metrics Summary Pill Row -->
    <g transform="translate(0, 105)">
      <!-- Pill 1 -->
      <rect x="-245" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="-170" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🛍️ 15+ Platforms</text>

      <!-- Pill 2 -->
      <rect x="-80" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="0" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⭐ Star-Sorted Stack</text>

      <!-- Pill 3 -->
      <rect x="95" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="170" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📊 Transparent TCO</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />
</svg>
